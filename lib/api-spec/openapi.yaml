openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: huMANity API - Explore history and culture of nations
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: countries
    description: Country operations
  - name: timeline
    description: Timeline event operations
  - name: milestones
    description: Cultural milestone operations
  - name: stories
    description: Personal story operations
  - name: explore
    description: Discovery and search operations
  - name: ai
    description: AI-powered features
  - name: pledge
    description: Humanity Pledge operations
  - name: Storage
    description: Object storage upload and serving endpoints
  - name: music
    description: Music catalog search (Apple Music / iTunes)
  - name: connections
    description: Human Connections - user lookup and mutual connection requests
  - name: world-news
    description: AI-curated positive World News feed, reactions, and saves

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/uploads/finalize:
    post:
      tags: [Storage]
      operationId: finalizeUpload
      summary: Finalize an uploaded object and publish it
      description: |
        Called after a successful PUT to the presigned URL. Sets a public ACL
        policy on the uploaded object (owned by the requesting user) so it can be
        served from the public profile. Requires authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeUploadRequest"
      responses:
        "200":
          description: Object finalized and published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizedUploadResult"
        "400":
          description: Missing or invalid object path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to finalize object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /music/search:
    get:
      tags: [music]
      operationId: searchMusic
      summary: Search the music catalog for a profile song
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Search term (song, artist, or album).
      responses:
        "200":
          description: Matching tracks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MusicTrack"
        "400":
          description: Missing query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /countries:
    get:
      operationId: listCountries
      tags: [countries]
      summary: List all countries
      parameters:
        - name: continent
          in: query
          required: false
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: religion
          in: query
          required: false
          schema:
            type: string
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
    post:
      operationId: createCountry
      tags: [countries]
      summary: Create a country entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"

  /countries/featured:
    get:
      operationId: listFeaturedCountries
      tags: [explore]
      summary: Get featured countries
      responses:
        "200":
          description: Featured countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"

  /countries/random:
    get:
      operationId: getRandomCountry
      tags: [explore]
      summary: Get a random country
      responses:
        "200":
          description: A random country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"

  /countries/daily:
    get:
      operationId: getDailyCountry
      tags: [explore]
      summary: Get the daily featured country
      description: Returns a deterministically selected country based on the current date
      responses:
        "200":
          description: Daily country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"

  /countries/search:
    get:
      operationId: searchCountries
      tags: [explore]
      summary: Search countries
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"

  /countries/continents:
    get:
      operationId: listContinents
      tags: [explore]
      summary: Get countries grouped by continent
      responses:
        "200":
          description: Countries by continent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinentGroup"

  /countries/compare:
    get:
      operationId: compareCountries
      tags: [explore]
      summary: Compare two countries side by side
      parameters:
        - name: a
          in: query
          required: true
          schema:
            type: string
          description: First country code
        - name: b
          in: query
          required: true
          schema:
            type: string
          description: Second country code
      responses:
        "200":
          description: Country comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryComparison"

  /countries/{code}:
    get:
      operationId: getCountry
      tags: [countries]
      summary: Get country detail
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Country detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryDetail"
        "404":
          description: Not found

  /countries/{code}/timeline:
    get:
      operationId: listTimeline
      tags: [timeline]
      summary: Get timeline events for a country
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"
    post:
      operationId: createTimelineEvent
      tags: [timeline]
      summary: Add a timeline event
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineEvent"

  /countries/{code}/milestones:
    get:
      operationId: listMilestones
      tags: [milestones]
      summary: Get cultural milestones for a country
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cultural milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CulturalMilestone"
    post:
      operationId: createMilestone
      tags: [milestones]
      summary: Add a cultural milestone
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CulturalMilestone"

  /countries/{code}/stories:
    get:
      operationId: listStories
      tags: [stories]
      summary: Get personal stories for a country
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Personal stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"
    post:
      operationId: createStory
      tags: [stories]
      summary: Add a personal story
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /countries/{code}/phrases:
    get:
      operationId: getCountryPhrases
      tags: [countries]
      summary: Get language phrases for a country
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Language phrases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryPhrase"

  /countries/{code}/stats:
    get:
      operationId: getCountryStats
      tags: [countries]
      summary: Get stats for a country
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Country stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryStats"

  /humanity-timeline:
    get:
      operationId: getHumanityTimeline
      tags: [timeline]
      summary: Cross-civilization humanity timeline
      description: Returns events from different civilizations grouped by historical era
      parameters:
        - name: era
          in: query
          required: false
          schema:
            type: string
            enum: [ancient, classical, medieval, modern, contemporary]
      responses:
        "200":
          description: Humanity timeline by era
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HumanityTimelineEra"

  /humanity-timeline/search:
    get:
      operationId: searchTimeline
      tags: [timeline]
      summary: Search timeline events across all nations
      description: Diacritic-insensitive search across nation names, event titles, and descriptions, with optional category/era filters.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search term (matches nation name, title, description)
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by event category
        - name: era
          in: query
          required: false
          schema:
            type: string
            enum: [ancient, classical, medieval, modern, contemporary]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Matching timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineSearchResult"

  /humanity-timeline/compare:
    get:
      operationId: compareTimelines
      tags: [timeline]
      summary: Compare the timelines of multiple nations side by side
      parameters:
        - name: countries
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated country codes (2-4)
      responses:
        "200":
          description: Per-nation timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NationTimeline"

  /walk-in-shoes:
    post:
      operationId: walkInShoes
      tags: [ai]
      summary: Walk In Their Shoes AI experience
      description: Generates an immersive first-person day-in-the-life narrative using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalkInShoesRequest"
      responses:
        "200":
          description: Immersive narrative response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkNarrativeResponse"

  /pledge:
    post:
      operationId: signPledge
      tags: [pledge]
      summary: Sign the Humanity Pledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PledgeInput"
      responses:
        "201":
          description: Pledge signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PledgeResponse"

  /pledge/count:
    get:
      operationId: getPledgeCount
      tags: [pledge]
      summary: Get total number of pledge signers
      responses:
        "200":
          description: Pledge count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PledgeCount"

  /me/profile:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: The user's profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
        "404":
          description: Profile not yet created
    put:
      operationId: updateMyProfile
      tags: [profile]
      summary: Create or update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized

  /me/pledge:
    post:
      operationId: pledgeAsUser
      tags: [profile]
      summary: Mark the signed-in user as having taken the Humanity Pledge
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized

  /profile/{userId}:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get a public profile by user id
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found

  /users/search:
    get:
      operationId: searchUsers
      tags: [connections]
      summary: Search people by name, username, or email
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching people with the viewer's connection status to each
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSearchResult"
        "401":
          description: Unauthorized

  /connections/recommendations:
    get:
      operationId: getConnectionRecommendations
      tags: [connections]
      summary: Recommend people to connect with based on shared interests
      description: Ranks non-connected members by overlap of interests, languages, country, and favorites with the signed-in user.
      responses:
        "200":
          description: Recommended people, highest match first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecommendedUser"
        "401":
          description: Unauthorized

  /connections:
    get:
      operationId: listConnections
      tags: [connections]
      summary: List the signed-in user's accepted Human Connections
      responses:
        "200":
          description: Accepted connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionUser"
        "401":
          description: Unauthorized

  /connections/requests:
    get:
      operationId: listConnectionRequests
      tags: [connections]
      summary: List pending incoming and outgoing connection requests
      responses:
        "200":
          description: Pending requests grouped by direction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionRequestsList"
        "401":
          description: Unauthorized
    post:
      operationId: sendConnectionRequest
      tags: [connections]
      summary: Send a connection request to another user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequestInput"
      responses:
        "201":
          description: Resulting connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatusResult"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "404":
          description: Target user not found

  /connections/requests/{id}/accept:
    post:
      operationId: acceptConnectionRequest
      tags: [connections]
      summary: Accept an incoming connection request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resulting connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatusResult"
        "401":
          description: Unauthorized
        "404":
          description: Request not found

  /connections/requests/{id}:
    delete:
      operationId: deleteConnectionRequest
      tags: [connections]
      summary: Decline an incoming request or cancel an outgoing one
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Request removed
        "401":
          description: Unauthorized
        "404":
          description: Request not found

  /connections/status/{userId}:
    get:
      operationId: getConnectionStatus
      tags: [connections]
      summary: Get the viewer's connection status with a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatusResult"
        "401":
          description: Unauthorized

  /connections/{userId}:
    delete:
      operationId: removeConnection
      tags: [connections]
      summary: Remove an existing connection with a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Connection removed
        "401":
          description: Unauthorized
        "404":
          description: Connection not found

  /messages:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List the signed-in user's direct-message conversations
      responses:
        "200":
          description: Conversations ordered by most recent message
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "401":
          description: Unauthorized

  /messages/unread-count:
    get:
      operationId: getUnreadMessageCount
      tags: [messages]
      summary: Total number of unread direct messages for the signed-in user
      responses:
        "200":
          description: Unread message count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          description: Unauthorized

  /messages/{userId}:
    get:
      operationId: getMessageThread
      tags: [messages]
      summary: Get the message thread with a specific connection
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The conversation partner and the messages exchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"
        "401":
          description: Unauthorized
        "403":
          description: Not connected with this user
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a direct message to a connection
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: The created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessage"
        "400":
          description: Invalid message
        "401":
          description: Unauthorized
        "403":
          description: Not connected with this user

  /messages/{userId}/read:
    post:
      operationId: markMessagesRead
      tags: [messages]
      summary: Mark all messages from a connection as read
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Messages marked as read
        "401":
          description: Unauthorized
        "403":
          description: Not connected with this user

  /dinner-table/current:
    get:
      operationId: getCurrentDinner
      tags: [dinner]
      summary: Get this week's World Dinner Table question and answers
      responses:
        "200":
          description: Current dinner question with answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentDinner"

  /dinner-table/questions:
    get:
      operationId: listDinnerQuestions
      tags: [dinner]
      summary: List all World Dinner Table questions (newest first)
      responses:
        "200":
          description: Question summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DinnerQuestionSummary"

  /dinner-table/questions/{id}:
    get:
      operationId: getDinnerQuestion
      tags: [dinner]
      summary: Get a specific dinner question with its answers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Question with answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DinnerQuestionDetail"
        "404":
          description: Not found

  /dinner-table/questions/{id}/answers:
    post:
      operationId: submitDinnerAnswer
      tags: [dinner]
      summary: Submit an answer to a dinner question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DinnerAnswerInput"
      responses:
        "201":
          description: The created answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DinnerAnswer"
        "401":
          description: Unauthorized
        "409":
          description: Already answered this question

  /world-news:
    get:
      operationId: listWorldNews
      tags: [world-news]
      summary: List AI-curated positive world news
      description: Returns the most recent positive news, newest first. Optional category/region filters. Viewer reaction/saved state is included when signed in.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: region
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Positive news items, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorldNewsItem"

  /world-news/saved:
    get:
      operationId: listSavedWorldNews
      tags: [world-news]
      summary: List the signed-in user's saved news
      responses:
        "200":
          description: Saved news items, most recently saved first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorldNewsItem"
        "401":
          description: Unauthorized

  /world-news/{id}/react:
    post:
      operationId: reactToWorldNews
      tags: [world-news]
      summary: Set or change the signed-in user's reaction on a news item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsReactionInput"
      responses:
        "200":
          description: The updated news item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldNewsItem"
        "401":
          description: Unauthorized
        "404":
          description: News item not found
    delete:
      operationId: removeWorldNewsReaction
      tags: [world-news]
      summary: Remove the signed-in user's reaction from a news item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The updated news item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldNewsItem"
        "401":
          description: Unauthorized
        "404":
          description: News item not found

  /world-news/{id}/save:
    post:
      operationId: saveWorldNews
      tags: [world-news]
      summary: Save a news item for the signed-in user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The updated news item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldNewsItem"
        "401":
          description: Unauthorized
        "404":
          description: News item not found
    delete:
      operationId: unsaveWorldNews
      tags: [world-news]
      summary: Remove a saved news item for the signed-in user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The updated news item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldNewsItem"
        "401":
          description: Unauthorized
        "404":
          description: News item not found

