apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def releaseSigningPropertiesFile = rootProject.file('key.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningProperties.load(new FileInputStream(releaseSigningPropertiesFile))
}
def requiredReleaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingReleaseSigningKeys = requiredReleaseSigningKeys.findAll { !releaseSigningProperties.getProperty(it) }
def hasReleaseSigningConfig = missingReleaseSigningKeys.isEmpty()

def clerkPublishableKey = System.getenv('VITE_CLERK_PUBLISHABLE_KEY')?.trim()
def frontendEnvFile = rootProject.file('../.env.local')
if (!clerkPublishableKey && frontendEnvFile.exists()) {
    def clerkEnvLine = frontendEnvFile.readLines().find { line ->
        line.trim().startsWith('VITE_CLERK_PUBLISHABLE_KEY=')
    }
    if (clerkEnvLine) {
        clerkPublishableKey = clerkEnvLine.substring(clerkEnvLine.indexOf('=') + 1).trim()
        clerkPublishableKey = clerkPublishableKey.replaceAll(/^['"]|['"]$/, '')
    }
}
def escapedClerkPublishableKey = (clerkPublishableKey ?: '')
    .replace('\\', '\\\\')
    .replace('"', '\\"')

gradle.taskGraph.whenReady { taskGraph ->
    def needsReleaseSigning = taskGraph.allTasks.any { task ->
        task.path.toLowerCase().contains('release')
    }
    if (needsReleaseSigning && !hasReleaseSigningConfig) {
        throw new GradleException("Release signing is missing ${missingReleaseSigningKeys.join(', ')} in ignored key.properties. See docs/google-play-internal-testing.md.")
    }
}

android {
    namespace = "app.humanity.global"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "app.humanity.global"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 23
        versionName "1.0.22"
        buildConfigField "String", "CLERK_PUBLISHABLE_KEY", "\"${escapedClerkPublishableKey}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile rootProject.file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.clerk:clerk-android-api:1.0.37'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
