kind = "web"
previewPath = "/"
title = "huMANity"
version = "1.0.0"
id = "artifacts/humanity"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19658

[services.development]
run = "pnpm --filter @workspace/humanity run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/humanity", "run", "build" ]
publicDir = "artifacts/humanity/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19658"
BASE_PATH = "/"
